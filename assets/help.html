        <h1>Instructions</h1>
        <p>To play Pac-Man use the following keys:</p>
        <ul>
            <li>Up arrow or W - to move up</li>
            <li>Down arrow or S - to move down</li>
            <li>Left arrow or A - to move left</li>
            <li>Right arrow or D - to move right/li>
        </ul>
